<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Lawking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="dist/app.css?v=2026-06-28-5">
</head>
<body>
  <header>
    <div class="brand" onclick="Lawking.openHome()">lawking</div>
    <div class="subtitle">deutscher Gesetzesbrowser (Online-Suche auf dem Server)</div>
  </header>

  <main>
    <aside>
      <section class="sidebar-section search-section">
        <h2>Gesetze online durchsuchen</h2>
        <input id="search" placeholder="Text, Wildcard* oder /regex/i — z.B. § 100a stpo" autocomplete="off">
        <div id="search-status"></div>
        <div id="results"></div>
      </section>

      <details id="knowledge-panel" class="sidebar-section knowledge-panel">
        <summary class="knowledge-panel-title">WissenDB</summary>
        <div id="knowledge"></div>
      </details>

      <section class="sidebar-section">
        <h2>Gesetzbücher</h2>
        <div id="books"></div>
      </section>
    </aside>

    <section id="viewer">
      <div class="welcome">
        <h1>Lawking</h1>
        <p>Deutscher Gesetzesbrowser mit serverseitiger Suche ohne großen Index-Download.</p>
        <p>Links suchen oder ein Gesetzbuch öffnen.</p>
      </div>
    </section>
  </main>

  <script>window.LAWKING_ASSET_VERSION = "2026-06-28-5"; window.LAWKING_SEARCH_API = "search.php";</script>
  <script src="node_modules/marked/marked.min.js?v=2026-06-28-5"></script>
  <script src="dist/app.js?v=2026-06-28-5"></script>
</body>
</html>
